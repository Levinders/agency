<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works | Packdez</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-container {
      background: #ffffff;
      width: 100%;
      max-width: 1100px;
      height: 75vh;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover:not(:disabled) {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-close:hover {
      background: #ef4444;
      color: white;
      border-color: #ef4444;
      transform: rotate(90deg);
    }

    .modal-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1.2fr 380px;
      overflow: hidden;
    }

    .video-section {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .video-container {
      width: 100%;
      max-width: 700px;
      position: relative;
      padding-bottom: 56.25%;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .details-section {
      background: #ffffff;
      padding: 24px;
      overflow-y: auto;
      border-left: 1px solid #e5e7eb;
    }

    .category-badge {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(102, 126, 234, 0.1);
      color: #667eea;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .project-title {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 24px;
      line-height: 1.3;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #f9fafb;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }

    .stat-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 900;
      color: #111827;
    }

    .like-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 24px;
      border: 2px solid #e5e7eb;
      background: #ffffff;
      color: #111827;
    }

    .like-btn:hover:not(:disabled) {
      border-color: #667eea;
      background: rgba(102, 126, 234, 0.05);
      color: #667eea;
    }

    .like-btn:disabled {
      background: #667eea;
      color: white;
      border-color: #667eea;
      cursor: not-allowed;
    }

    .like-btn svg.filled {
      fill: currentColor;
    }

    .info-section {
      margin-bottom: 24px;
    }

    .info-section:last-child {
      margin-bottom: 0;
    }

    .info-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .info-text {
      font-size: 14px;
      line-height: 1.6;
      color: #111827;
    }

    .icon {
      width: 20px;
      height: 20px;
    }

    .icon-sm {
      width: 16px;
      height: 16px;
    }

    @media (max-width: 1024px) {
      .modal-body {
        grid-template-columns: 1fr;
      }

      .details-section {
        border-left: none;
        border-top: 1px solid #e5e7eb;
      }
    }

    @media (max-width: 768px) {
      .modal-container {
        height: 90vh;
      }

      .modal-title {
        font-size: 16px;
      }

      .project-title {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="modal-overlay">
    <div class="modal-container">
      <!-- Header -->
      <div class="modal-header">
        <h2 class="modal-title">Works | Packdez</h2>
        <div class="header-controls">
          <button class="btn" id="prevBtn" onclick="previousProject()">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <button class="btn" id="nextBtn" onclick="nextProject()">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
          <button class="btn btn-close" onclick="closeModal()">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <!-- Video Section -->
        <div class="video-section">
          <div class="video-container">
            <iframe
              id="videoFrame"
              src=""
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>
        </div>

        <!-- Details Section -->
        <div class="details-section">
          <span class="category-badge" id="category"></span>
          <h3 class="project-title" id="title"></h3>

          <!-- Stats -->
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">
                <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
                <span>Views</span>
              </div>
              <div class="stat-value" id="views">0</div>
            </div>

            <div class="stat-card">
              <div class="stat-label">
                <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                </svg>
                <span>Likes</span>
              </div>
              <div class="stat-value" id="likes">0</div>
            </div>
          </div>

          <!-- Like Button -->
          <button class="like-btn" id="likeBtn" onclick="likeProject()">
            <svg class="icon" id="heartIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
            <span id="likeText">Like this project</span>
          </button>

          <!-- Description -->
          <div class="info-section">
            <div class="info-label">Description</div>
            <p class="info-text" id="description"></p>
          </div>

          <!-- Tools -->
          <div class="info-section">
            <div class="info-label">Tools & Technologies</div>
            <p class="info-text" id="tools"></p>
          </div>

          <!-- Outcome -->
          <div class="info-section">
            <div class="info-label">Business Impact</div>
            <p class="info-text" id="outcome"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const FIREBASE_URL = 'https://packdez-projects-default-rtdb.firebaseio.com';
    
    const projects = [
      {
        id: 1,
        title: "Looker Studio Healthcare Dashboard",
        category: "Dashboard",
        videoId: "-svuBj0WpkE",
        description: "A comprehensive healthcare dashboard built with Looker Studio for tracking patient metrics and operational KPIs.",
        tools: "Looker Studio, Google Sheets, Healthcare APIs",
        outcome: "Reduced reporting time by 75% and improved data visibility across departments."
      },
      {
        id: 2,
        title: "Google Sheet Invoice/Payslip Auto Generator",
        category: "Automation",
        videoId: "4fjE3eJ01T4",
        description: "Automated invoice and payslip generation system that creates professional documents from Google Sheets data.",
        tools: "Google Sheets, Apps Script, PDF Generation",
        outcome: "Eliminated manual invoice creation, saving 10+ hours per week."
      },
      {
        id: 3,
        title: "Custom Login Page with Looker Studio",
        category: "Authentication",
        videoId: "AaMAOE3BrUM",
        description: "Secure custom login page integrated with Looker Studio for controlled dashboard access.",
        tools: "Looker Studio, Google Apps Script, Authentication APIs",
        outcome: "Enhanced security and provided branded user experience for clients."
      },
      {
        id: 4,
        title: "Custom Survey Form with Google Sheets",
        category: "Forms",
        videoId: "1Oa7EgHFoLs",
        description: "Custom-branded survey form that automatically populates responses into organized Google Sheets.",
        tools: "Google Forms, Google Sheets, Custom HTML/CSS",
        outcome: "Increased survey completion rate by 40% with improved UX."
      },
      {
        id: 5,
        title: "Automated Workflow System",
        category: "Automation",
        videoId: "ykFwXvWZ6lc",
        description: "End-to-end workflow automation that connects multiple tools and eliminates manual data entry.",
        tools: "Google Sheets, Zapier, Multiple APIs",
        outcome: "Automated 90% of manual tasks, freeing up team for strategic work."
      },
      {
        id: 6,
        title: "Real-time Data Integration",
        category: "Integration",
        videoId: "HsMaIpEOlF4",
        description: "Real-time data synchronization between multiple platforms for unified reporting.",
        tools: "Google Sheets, APIs, Real-time Sync",
        outcome: "Achieved real-time data accuracy across all business systems."
      }
    ];

    let currentIndex = 0;
    let stats = {};
    let liked = {};

    function loadProjectStats(projectId) {
      fetch(`${FIREBASE_URL}/projects/${projectId}.json`)
        .then(response => response.json())
        .then(data => {
          const projectStats = data || { views: 0, likes: 0 };
          stats[projectId] = projectStats;
          
          // Increment views
          const newViews = projectStats.views + 1;
          fetch(`${FIREBASE_URL}/projects/${projectId}/views.json`, {
            method: 'PUT',
            body: JSON.stringify(newViews)
          });
          
          stats[projectId].views = newViews;
          updateDisplay();
        })
        .catch(error => {
          console.error('Error loading stats:', error);
          stats[projectId] = { views: 0, likes: 0 };
          updateDisplay();
        });
    }

    function checkIfLiked(projectId) {
      const hasLiked = localStorage.getItem(`liked_${projectId}`) === 'true';
      liked[projectId] = hasLiked;
      updateLikeButton();
    }

    function likeProject() {
      const project = projects[currentIndex];
      if (liked[project.id]) return;

      const currentStats = stats[project.id] || { views: 0, likes: 0 };
      const newLikes = currentStats.likes + 1;
      
      fetch(`${FIREBASE_URL}/projects/${project.id}/likes.json`, {
        method: 'PUT',
        body: JSON.stringify(newLikes)
      })
      .then(() => {
        stats[project.id].likes = newLikes;
        liked[project.id] = true;
        localStorage.setItem(`liked_${project.id}`, 'true');
        updateDisplay();
      })
      .catch(error => console.error('Error liking project:', error));
    }

    function updateDisplay() {
      const project = projects[currentIndex];
      const projectStats = stats[project.id] || { views: 0, likes: 0 };
      
      document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${project.videoId}`;
      document.getElementById('category').textContent = project.category;
      document.getElementById('title').textContent = project.title;
      document.getElementById('description').textContent = project.description;
      document.getElementById('tools').textContent = project.tools;
      document.getElementById('outcome').textContent = project.outcome;
      document.getElementById('views').textContent = (projectStats.views || 0).toLocaleString();
      document.getElementById('likes').textContent = (projectStats.likes || 0).toLocaleString();
      
      updateLikeButton();
      updateNavigationButtons();
    }

    function updateLikeButton() {
      const project = projects[currentIndex];
      const isLiked = liked[project.id];
      const likeBtn = document.getElementById('likeBtn');
      const likeText = document.getElementById('likeText');
      const heartIcon = document.getElementById('heartIcon');
      
      if (isLiked) {
        likeBtn.disabled = true;
        likeText.textContent = 'Liked';
        heartIcon.classList.add('filled');
      } else {
        likeBtn.disabled = false;
        likeText.textContent = 'Like this project';
        heartIcon.classList.remove('filled');
      }
    }

    function updateNavigationButtons() {
      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').disabled = currentIndex === projects.length - 1;
    }

    function previousProject() {
      if (currentIndex > 0) {
        currentIndex--;
        loadProject();
      }
    }

    function nextProject() {
      if (currentIndex < projects.length - 1) {
        currentIndex++;
        loadProject();
      }
    }

    function loadProject() {
      const project = projects[currentIndex];
      loadProjectStats(project.id);
      checkIfLiked(project.id);
    }

    function closeModal() {
      // For standalone page, you might want to redirect or just hide
      alert('Modal close requested');
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowLeft') previousProject();
      if (e.key === 'ArrowRight') nextProject();
    });

    // Initialize
    loadProject();
  </script>
</body>
</html>
