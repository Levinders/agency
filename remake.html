<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets Automation for Operations Teams | Packdez</title>
    <meta name="description" content="We build automated operational systems in Google Sheets for growing teams. No templates. No bloat. Just reliable systems that work.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* =====================================================
           BASE RESET + VARIABLES (UNCHANGED)
        ====================================================== */
        :root {
            --background: 0 0% 100%;
            --foreground: 220 20% 10%;
            --primary: 146 55% 36%;
            --primary-foreground: 0 0% 100%;
            --muted: 220 14% 96%;
            --muted-foreground: 220 9% 46%;
            --border: 220 13% 91%;
            --destructive: 0 84% 60%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            scroll-behavior: smooth;
            line-height: 1.6;
            overflow-x: hidden; /* prevent horizontal scroll on mobile */
        }

        /* =====================================================
           MOBILE NAV VISIBILITY HELPERS
        ====================================================== */
        .desktop-only {
            display: flex;
        }

        .mobile-only {
            display: none;
        }

        @media (max-width: 768px) {
            .desktop-only {
                display: none;
            }
            .mobile-only {
                display: flex;
            }
        }

        /* =====================================================
           MOBILE SIDEBAR MENU
        ====================================================== */
        .mobile-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(6px);
            z-index: 90;
            display: none;
        }

        .mobile-overlay.active {
            display: block;
        }

        .mobile-sidebar {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            width: 85%;
            max-width: 320px;
            background: white;
            z-index: 100;
            padding: 24px;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .mobile-sidebar.active {
            transform: translateX(0);
        }

        .mobile-sidebar a {
            padding: 14px 0;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid hsl(var(--border));
        }

        /* =====================================================
           KEEP EXISTING STYLES BELOW (UNCHANGED)
           (Pricing, Reviews, ROI, etc)
        ====================================================== */

        /* ---- YOUR EXISTING CSS CONTINUES UNCHANGED ---- */
    </style>
</head>

<body>

<!-- =====================================================
     MOBILE NAV OVERLAY
====================================================== -->
<div id="mobile-overlay" class="mobile-overlay" onclick="closeMobileMenu()"></div>

<!-- =====================================================
     MOBILE SIDEBAR MENU
====================================================== -->
<aside id="mobile-menu" class="mobile-sidebar">
    <button onclick="closeMobileMenu()" class="mb-6 text-right font-bold text-xl">×</button>

    <a href="#work" onclick="closeMobileMenu()">Work</a>
    <a href="#pricing" onclick="closeMobileMenu()">Pricing</a>
    <a href="#reviews" onclick="closeMobileMenu()">Reviews</a>
    <a href="#faq" onclick="closeMobileMenu()">About</a>

    <a href="#audit" onclick="closeMobileMenu()" class="mt-6 btn btn-primary">
        Get Automation Plan
    </a>
</aside>

<!-- =====================================================
     FIXED NAVIGATION BAR
====================================================== -->
<nav class="nav-fixed">
    <div class="max-w-6xl mx-auto px-4">
        <div class="flex items-center justify-between h-16">

            <!-- LOGO -->
            <a href="/" class="flex items-center gap-2">
                <img src="https://packdez.com/assets/logo/packdez-logo-512x512.png" alt="Packdez" class="h-8 w-8">
                <span class="text-xl font-bold">Packdez</span>
            </a>

            <!-- DESKTOP NAV -->
            <div class="desktop-only items-center gap-6">
                <a href="#work" class="text-sm font-medium text-muted-foreground hover:text-primary">Work</a>
                <a href="#pricing" class="text-sm font-medium text-muted-foreground hover:text-primary">Pricing</a>
                <a href="#reviews" class="text-sm font-medium text-muted-foreground hover:text-primary">Reviews</a>
                <a href="#faq" class="text-sm font-medium text-muted-foreground hover:text-primary">About</a>
                <a href="#audit" class="btn btn-primary ml-4" style="padding:0.5rem 1.25rem;">Get Automation Plan</a>
            </div>

            <!-- MOBILE HAMBURGER -->
            <button class="mobile-only" onclick="toggleMobileMenu()" aria-label="Open menu">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>

        </div>
    </div>
</nav>

<!-- =====================================================
     PAGE CONTENT (UNCHANGED)
====================================================== -->
<!-- EVERYTHING BELOW REMAINS EXACTLY AS YOU PROVIDED -->
<!-- (Hero, sections, pricing, reviews, ROI, FAQ, footer) -->

<!-- ... YOUR FULL CONTENT CONTINUES HERE WITHOUT CHANGES ... -->

<!-- =====================================================
     MOBILE MENU SCRIPT
====================================================== -->
<script>
    function toggleMobileMenu() {
        document.getElementById('mobile-menu').classList.add('active');
        document.getElementById('mobile-overlay').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeMobileMenu() {
        document.getElementById('mobile-menu').classList.remove('active');
        document.getElementById('mobile-overlay').classList.remove('active');
        document.body.style.overflow = '';
    }
</script>

<script>
    lucide.createIcons();
</script>

</body>
</html>
